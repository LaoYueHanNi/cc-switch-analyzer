[package]
name = "cc-switch-analyzer"
version = "0.8.1"
description = "CC-Switch 使用分析器 — Tauri 版本"
authors = ["LaoYueHanNi"]
license = "MIT"
repository = "https://github.com/LaoYueHanNi/cc-switch-analyzer"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
dirs = "5"
chrono = "0.4"
ureq = "3"
zstd = "0.13"

[dev-dependencies]
tempfile = "3"

# 生产构建优化（仅影响 cargo build --release，dev 不受影响）
[profile.release]
lto = true          # 链接时优化：减小体积、提升运行性能（代价：release 编译变慢）
codegen-units = 1   # 单编译单元：更好的全局优化
strip = true        # 去除符号表：显著减小 binary 体积
