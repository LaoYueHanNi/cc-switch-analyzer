[package]
name = "cc-switch-analyzer"
version = "0.8.8"
description = "CC-Switch 使用分析器 — Tauri 版本"
authors = ["LaoYueHanNi"]
license = "MIT"
repository = "https://github.com/LaoYueHanNi/cc-switch-analyzer"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
dirs = "5"
chrono = "0.4"
ureq = "3"
zstd = "0.13"

# macOS 原生菜单栏（NSStatusItem 两行小字），版本与 tauri 依赖树内一致，不引入重复编译
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-text = { version = "0.3", features = ["CTFrame", "CTFramesetter"] }
objc2-app-kit = { version = "0.3.2", features = [
    "NSApplication", "NSAttributedString", "NSBitmapImageRep", "NSButton",
    "NSCell", "NSEvent", "NSFont", "NSGraphicsContext", "NSImage",
    "NSMenu", "NSMenuItem", "NSParagraphStyle", "NSStatusBar",
    "NSStatusBarButton", "NSStatusItem",
] }
objc2-foundation = { version = "0.3", features = [
    "NSAttributedString", "NSData", "NSGeometry", "NSDictionary",
    "NSString", "NSValue",
] }

[dev-dependencies]
tempfile = "3"

# 生产构建优化（仅影响 cargo build --release，dev 不受影响）
[profile.release]
lto = true          # 链接时优化：减小体积、提升运行性能（代价：release 编译变慢）
codegen-units = 16  # 并行 codegen：显著加快 release 编译（相比 =1 优化略保守）
strip = true        # 去除符号表：显著减小 binary 体积
