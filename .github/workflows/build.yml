name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.7.0)'
        required: true

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          TARGET="$(git rev-parse HEAD)"
          NOTES=$(git log -1 --format=%b HEAD)
          if gh release view "$TAG" > /dev/null 2>&1; then
            # 重打 tag 后 release 可能变 draft，强制发布并指向当前 commit
            gh release edit "$TAG" --draft=false --target "$TARGET" --notes "$NOTES"
          else
            gh release create "$TAG" --title "$TAG" --notes "$NOTES" --target "$TARGET"
          fi

  build-windows:
    needs: create-release
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: pnpm install

      - name: Clean old MSI artifacts
        shell: bash
        run: rm -rf src-tauri/target/release/bundle/msi/*.msi src-tauri/target/release/bundle/msi/*.msi.sig

      - name: Build MSI
        run: pnpm tauri build

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          find src-tauri/target/release/bundle/msi -name "CC-Switch*${TAG#v}*.msi" -exec echo "Uploading: {}" \; -exec gh release upload "$TAG" {} --clobber \;
          find src-tauri/target/release/bundle/msi -name "CC-Switch*${TAG#v}*.msi.sig" -exec echo "Uploading: {}" \; -exec gh release upload "$TAG" {} --clobber \;

  build-macos:
    needs: create-release
    runs-on: macos-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: pnpm install

      - name: Clean old macOS artifacts
        shell: bash
        run: rm -rf src-tauri/target/release/bundle/dmg/*.dmg src-tauri/target/release/bundle/macos/*.tar.gz src-tauri/target/release/bundle/macos/*.tar.gz.sig

      - name: Build APP
        run: pnpm tauri build

      - name: Upload APP
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.tar.gz
            src-tauri/target/release/bundle/macos/*.tar.gz.sig

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          find src-tauri/target/release/bundle/dmg -name "*${TAG#v}*.dmg" -exec echo "Uploading: {}" \; -exec gh release upload "$TAG" {} --clobber \;
          find src-tauri/target/release/bundle/macos -name "*.tar.gz" -exec echo "Uploading: {}" \; -exec gh release upload "$TAG" {} --clobber \;
          find src-tauri/target/release/bundle/macos -name "*.tar.gz.sig" -exec echo "Uploading: {}" \; -exec gh release upload "$TAG" {} --clobber \;

  generate-manifest:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate latest.json
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: node scripts/generate-latest-json.cjs

      - name: Upload latest.json to Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" latest.json --clobber
